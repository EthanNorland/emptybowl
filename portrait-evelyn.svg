  <ellipse cx="76" cy="56" rx="2.2" ry="3.8" fill="#cea282"/>
  <circle cx="44" cy="58" r="1.3" fill="#f5f0ea"/>
  <circle cx="76" cy="58" r="1.3" fill="#f5f0ea"/>

  <!-- Delicate Eyebrows -->
  <path d="M 49 48 Q 53 46 56 48" stroke="#8a8377" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 64 48 Q 67 46 71 48" stroke="#8a8377" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Delicate Gold Glasses -->
  <rect x="47" y="48.5" width="10" height="8" rx="2.5" stroke="#e5a93b" stroke-width="1.4" fill="rgba(255,255,255,0.12)"/>
  <rect x="63" y="48.5" width="10" height="8" rx="2.5" stroke="#e5a93b" stroke-width="1.4" fill="rgba(255,255,255,0.12)"/>
  <!-- Bridge & Temples -->
  <path d="M 57 51 Q 60 49.5 63 51" stroke="#e5a93b" stroke-width="1.4" fill="none"/>
  <path d="M 47 51 L 43 53" stroke="#e5a93b" stroke-width="1.2"/>
  <path d="M 73 51 L 77 53" stroke="#e5a93b" stroke-width="1.2"/>

  <!-- Eyes behind lenses -->
  <circle cx="52" cy="52.5" r="1.5" fill="#362920"/>
  <circle cx="68" cy="52.5" r="1.5" fill="#362920"/>

  <!-- Smile Lines / Gentle Expression -->
  <path d="M 49 53 Q 48 56 49 58" stroke="#b08669" stroke-width="0.8" fill="none"/>
  <path d="M 71 53 Q 72 56 71 58" stroke="#b08669" stroke-width="0.8" fill="none"/>

  <!-- Nose & Smile -->
  <path d="M 60 52 L 59 58 L 61.5 58.5" stroke="#a67b5e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 55 64 Q 60 67 65 64" stroke="#ab6b60" stroke-width="1.8" stroke-linecap="round" fill="none"/>
