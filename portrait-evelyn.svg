  <path d="M 24 116 Q 28 84 48 82 Q 60 86 72 82 Q 92 84 96 116 Z" fill="url(#evelynShawl)"/>

  <!-- Shawl Lapel / V-neck -->
  <path d="M 48 82 L 60 98 L 72 82 Z" fill="#3a5842"/>
  <path d="M 54 90 L 60 98 L 66 90 Z" fill="#2d2924"/>

  <!-- Head / Face -->
  <ellipse cx="60" cy="55" rx="15.5" ry="18.5" fill="url(#evelynSkin)"/>

  <!-- Soft Wavy Silver Hair Front -->
  <path d="M 43 48 Q 46 32 60 32 Q 74 32 77 48 Q 72 40 60 40 Q 48 40 43 48 Z" fill="#d4cfc7"/>
  <path d="M 43 46 Q 48 37 57 37 Q 50 44 45 52 Z" fill="#c4bfb7"/>
