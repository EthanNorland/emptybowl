<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" role="img" aria-label="Portrait illustration of Evelyn">
  <defs>
    <linearGradient id="evelynBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2924"/>
      <stop offset="100%" stop-color="#1c1a17"/>
    </linearGradient>
    <linearGradient id="evelynSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e3be9f"/>
      <stop offset="100%" stop-color="#cea282"/>
    </linearGradient>
    <linearGradient id="evelynShawl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a6e53"/>
      <stop offset="100%" stop-color="#2e4835"/>
