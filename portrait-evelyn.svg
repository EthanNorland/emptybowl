  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#evelynBg)" stroke="#aba398" stroke-width="2.5"/>

  <!-- Silver Hair Background Silhouette -->
  <path d="M 40 56 Q 38 28 60 28 Q 82 28 80 56 Q 84 66 79 72 Q 74 72 73 66 Q 71 36 60 36 Q 49 36 47 66 Q 46 72 41 72 Q 36 66 40 56 Z" fill="#b0aba2"/>

