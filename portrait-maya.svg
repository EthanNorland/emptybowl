<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" role="img" aria-label="Portrait illustration of Maya">
  <!-- Background Circle with Soft Walnut & Linen Gradient -->
  <defs>
    <linearGradient id="mayaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2924"/>
      <stop offset="100%" stop-color="#1c1a17"/>
    </linearGradient>
    <linearGradient id="mayaSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cf9e7e"/>
      <stop offset="100%" stop-color="#ba8767"/>
    </linearGradient>
    <linearGradient id="mayaSweater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#558963"/>
      <stop offset="100%" stop-color="#3d6849"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="58" fill="url(#mayaBg)" stroke="#558963" stroke-width="2.5"/>

  <!-- Hair Back Bun -->
  <circle cx="60" cy="30" r="14" fill="#2b2018"/>

  <!-- Neck & Shoulders / Sweater -->
  <path d="M 52 64 L 52 76 Q 52 80 60 80 Q 68 80 68 76 L 68 64 Z" fill="url(#mayaSkin)"/>
  <path d="M 28 116 Q 30 84 50 82 Q 60 85 70 82 Q 90 84 92 116 Z" fill="url(#mayaSweater)"/>
  
  <!-- Sweater Collar Detail -->
  <path d="M 50 82 Q 60 90 70 82 Q 65 96 55 96 Q 50 90 50 82 Z" fill="#36583e" opacity="0.6"/>

  <!-- Head / Face -->
  <ellipse cx="60" cy="54" rx="16" ry="20" fill="url(#mayaSkin)"/>

  <!-- Hair Front / Framing -->
  <path d="M 44 48 Q 45 32 60 32 Q 75 32 76 48 Q 69 41 60 41 Q 50 41 44 48 Z" fill="#241912"/>
  <path d="M 44 46 Q 47 38 58 38 Q 49 46 45 56 Z" fill="#241912"/>
  <path d="M 76 46 Q 73 38 62 38 Q 71 46 75 56 Z" fill="#241912"/>

  <!-- Ears & Subtle Studs -->
  <ellipse cx="43.5" cy="55" rx="2.5" ry="4" fill="#ba8767"/>
  <ellipse cx="76.5" cy="55" rx="2.5" ry="4" fill="#ba8767"/>
  <circle cx="43.5" cy="57" r="1.2" fill="#e5a93b"/>
  <circle cx="76.5" cy="57" r="1.2" fill="#e5a93b"/>

  <!-- Eyebrows -->
  <path d="M 49 48 Q 53 46 56 48" stroke="#241912" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 64 48 Q 67 46 71 48" stroke="#241912" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="53" cy="52.5" rx="2.2" ry="1.6" fill="#241912"/>
  <ellipse cx="67" cy="52.5" rx="2.2" ry="1.6" fill="#241912"/>
  <circle cx="53.6" cy="52" r="0.6" fill="#ffffff"/>
  <circle cx="67.6" cy="52" r="0.6" fill="#ffffff"/>

  <!-- Nose & Lips -->
  <path d="M 60 52 L 59 58 L 61.5 58.5" stroke="#9e6d4f" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 55 64 Q 60 67 65 64" stroke="#a35f52" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>