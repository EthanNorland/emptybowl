<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="104" fill="#181614"/>
  <defs>
    <linearGradient id="cavityGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#365e43"/>
      <stop offset="35%" stop-color="#223d2a"/>
      <stop offset="100%" stop-color="#0e1c12"/>
    </linearGradient>
    <linearGradient id="cutFaceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#72a983"/>
      <stop offset="40%" stop-color="#558963"/>
      <stop offset="100%" stop-color="#3a6345"/>
    </linearGradient>
  </defs>

  <!-- Gentle Back Rim (soft rise showing the natural circular lip receding into background) -->
  <path d="M 66 182
           C 66 156, 446 156, 446 182
           C 410 162, 102 162, 66 182 Z" fill="#426a4c"/>
  <!-- Back Rim Inner Lip highlight -->
  <path d="M 106 182
           C 126 166, 386 166, 406 182
           C 382 170, 130 170, 106 182 Z" fill="#6ba67c"/>

  <!-- Empty Interior Cavity (Deep hollow of the empty bowl) -->
  <path d="M 106 182
           C 130 170, 382 170, 406 182
           C 380 278, 326 338, 256 338
           C 186 338, 132 278, 106 182 Z" fill="url(#cavityGrad)"/>

  <!-- Interior Floor Shadow (tactile weight of the empty space) -->
  <ellipse cx="256" cy="314" rx="66" ry="17" fill="#07100a" opacity="0.95"/>
  <ellipse cx="256" cy="308" rx="92" ry="22" fill="#112015" opacity="0.55"/>

  <!-- FRONT CROSS-SECTION (Ceramic Wall Cut Facing Directly Forward) -->
  <path d="M 66 182
           C 64 179, 68 176, 72 176
           L 100 176
           C 104 176, 108 179, 106 182
           C 132 278, 186 338, 256 338
           C 326 338, 380 278, 406 182
           C 404 179, 408 176, 412 176
           L 440 176
           C 444 176, 448 179, 446 182
           C 418 288, 344 378, 310 390
           L 310 416 C 310 420, 304 422, 298 422
           L 214 422 C 208 422, 202 420, 202 416
           L 202 390
           C 168 378, 94 288, 66 182
           Z" fill="url(#cutFaceGrad)" stroke="#8ec39d" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Foot Arch Hollow (Underside of foot ring) -->
  <path d="M 214 422 L 298 422 C 298 404, 214 404, 214 422 Z" fill="#181614"/>

  <!-- Polished Rim Highlights -->
  <line x1="72" y1="176" x2="100" y2="176" stroke="#c2ecd0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="412" y1="176" x2="440" y2="176" stroke="#c2ecd0" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Inner Wall Lip Bevel -->
  <path d="M 106 182 C 132 278, 186 338, 256 338 C 326 338, 380 278, 406 182" fill="none" stroke="#a2d9b2" stroke-width="1.75" opacity="0.75"/>
</svg>
